<!DOCTYPE html>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

<body class="flex items-center justify-center min-h-screen bg-gradient-to-r from-red-400 via-red-500 to-red-600 text-white p-4">

        <a href="login.html" class="inline-block px-8 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-lg
