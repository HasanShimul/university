<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Digital Wallet - Password Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
    </head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-[linear-gradient(to_right,#6b7280,#1f2937)] py-4 text-white text-center text-xl font-bold">
        ABC Digital Wallet
    </header>

    <div class="bg-[linear-gradient(to_right,#4ade80,#10b981)] py-2 text-white text-center text-lg">
        Password Reset
    </div>

    <main class="flex-grow flex justify-center items-center bg-[linear-gradient(to_right,#6b7280_0%,#1f2937_20%,#a7f3d0_50%,#14b8a6_70%,#3b82f6_100%)] p-4 md:p-8">
        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-y-6 md:gap-y-12 md:gap-x-8 items-center justify-items-start">
            <label for="phone-email" class="w-full max-w-xs md:max-w-none  text-lg font-medium px-4 py-3 rounded-md shadow-md text-white">
                Enter Phone/ E-mail
            </label>
            <input type="text" id="phone-email" class="w-full max-w-xs md:max-w-md p-3 rounded-md shadow-md bg-[linear-gradient(to_right,#d1fae5,#a7f3d0)] text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">

            <label for="otp" class="w-full max-w-xs md:max-w-none  text-lg font-medium px-4 py-3 rounded-md shadow-md text-white">
                OTP
            </label>
            <input type="text" id="otp" class="w-full max-w-xs md:max-w-md p-3 rounded-md shadow-md bg-[linear-gradient(to_right,#d1fae5,#a7f3d0)] text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">

            <div class="col-span-1 md:col-span-2 flex justify-center mt-6 md:mt-0">
                <button type="submit" class="text-white px-10 py-3 rounded-md shadow-lg text-lg font-semibold hover:opacity-90 transition duration-300 bg-[linear-gradient(to_right,#60a5fa,#3b82f6)]" id="submit">
                    Submit
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-[linear-gradient(to_right,#6b7280,#1f2937)] py-6 text-white text-sm">
        <div class="container mx-auto flex flex-wrap justify-between items-center px-4 md:px-8">
            <div class="flex flex-wrap space-x-6 mb-4 md:mb-0">
                <a href="#" class="hover:text-gray-300">E-mail</a>
                <a href="#" class="hover:text-gray-300">Help</a>
                <a href="#" class="hover:text-gray-300">Feedback</a>
            </div>
            <div class="flex flex-wrap space-x-6">
                <span class="font-bold">Follow us</span>
                <a href="#" class="hover:text-gray-300">Meta</a>
                <a href="#" class="hover:text-gray-300">Instgram</a>
                <a href="#" class="hover:text-gray-300">Youtube</a>
                <a href="#" class="hover:text-gray-300">Linkedin</a>
            </div>
        </div>
    </footer>

    <script>
        const submit = document.getElementById('submit');

        if(submit){
            submit.addEventListener('click',function(event){
                event.preventDefault();
                window.location.href = 'resetpassword2.html';
            });
        }
    </script>
</body>
</html>
