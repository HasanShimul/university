<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Digital Wallet - Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-header {
            background: linear-gradient(to right, #6b7280, #1f2937); /* Dark grey gradient */
        }
        .gradient-section-bar {
            background: linear-gradient(to right, #4ade80, #10b981); /* Green gradient */
        }
        .gradient-main-bg {
            background: linear-gradient(to bottom right, #a7f3d0, #14b8a6); /* Light to dark teal/green gradient */
        }
        .gradient-input {
            background: linear-gradient(to right, #d1fae5, #a7f3d0); /* Light green/teal input gradient */
        }
        .gradient-button {
            background: linear-gradient(to right, #60a5fa, #3b82f6); /* Blue button gradient */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="gradient-header py-4 text-white text-center text-xl font-bold">
        ABC Digital Wallet
    </header>

    <div class="gradient-section-bar py-2 text-white text-center text-lg">
        Change Password
    </div>

    <main class="flex-grow p-4 md:p-8 flex justify-center items-start">
        <div class="gradient-main-bg rounded-lg shadow-lg p-6 md:p-10 w-full max-w-2xl">
            <form class="space-y-6 md:space-y-8">
                <div class="flex flex-col md:flex-row md:items-center">
                    <label for="last-password" class="w-full md:w-1/2 text-gray-700 text-lg md:text-xl font-medium mb-2 md:mb-0">Enter Last Password</label>
                    <input type="password" id="last-password" class="w-full md:w-1/2 p-3 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="flex flex-col md:flex-row md:items-center">
                    <label for="new-password" class="w-full md:w-1/2 text-gray-700 text-lg md:text-xl font-medium mb-2 md:mb-0">New Password</label>
                    <input type="password" id="new-password" class="w-full md:w-1/2 p-3 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="flex flex-col md:flex-row md:items-center">
                    <label for="confirm-new-password" class="w-full md:w-1/2 text-gray-700 text-lg md:text-xl font-medium mb-2 md:mb-0">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" class="w-full md:w-1/2 p-3 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div class="pt-4 flex justify-center">
                    <button type="submit" class="gradient-button text-white px-10 py-3 rounded-md shadow-lg text-lg font-semibold hover:opacity-90 transition duration-300" id="saveChange">
                        Save Change
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const saveChange = document.getElementById('saveChange');

        if(saveChange){
            saveChange.addEventListener('click',function(event){
                event.preventDefault();
                window.location.href = 'profile.html';
            });
        }
    </script>
</body>
</html>
