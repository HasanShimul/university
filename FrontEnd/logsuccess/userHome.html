<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Digital Wallet:Dashbaord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg-left {
            background: linear-gradient(to right, #e2b2ff, #a280ff);
            /* Adjusted for visual similarity */
        }

        .gradient-bg-right {
            background: linear-gradient(to right, #a280ff, #e2b2ff);
            /* Adjusted for visual similarity */
        }

        .top-gradient {
            background: linear-gradient(to right, #a0a0a0, #707070, #404040);
            /* Darker gray to match image */
        }
    </style>
</head>

<body class="bg-gradient-to-r from-gray-700 via-gray-600 to-green-500 ">
    <div class="max-w-7xl mx-auto mt-8 bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="top-gradient text-white p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">ABC Digital Wallet </h1>
            <div class="flex space-x-4">
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200"
                    id="profile">Profile</a>
                <a href="#" class="px-4 py-2 bg-blue-600 rounded">Dashboard</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200"
                    id="account">Accounts</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200"
                    id="transfer">Transfer</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200"
                    id="payment">Payments</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200"
                    id="history">History</a>
                <a href="#" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700 transition-colors duration-200"
                    id="logout">Log Out</a>
            </div>
        </div>

        <div class="p-6 flex space-x-6">
            <div class="w-2/3 gradient-bg-left text-white p-6 rounded-lg shadow-md">
                <h2 id="welcomeMessage" class="text-xl font-semibold mb-4"></h2>
                <p class="text-lg mb-2">Saving Account</p>
                <div class="mt-8">
                    <p class="text-3xl font-bold mb-2">Your Balance : <span class="text-4xl">999999</span> BDT</p>
                    <p class="text-3xl font-bold mt-4">Card Number :<span class="text-3xl">1097XXXXXXXX</span></p>
                </div>
            </div>

            <div class="w-1/3 gradient-bg-right text-white p-6 rounded-lg shadow-md flex flex-col items-center">
                <h2 class="text-xl font-semibold mb-6">Your Shortcut</h2>
                <div class="space-y-4 w-full">
                    <button
                        class="bg-white text-purple-700 py-3 px-6 rounded-lg shadow-md hover:bg-gray-100 transition-colors duration-200 w-full">Cards</button>
                    <button
                        class="bg-white text-purple-700 py-3 px-6 rounded-lg shadow-md hover:bg-gray-100 transition-colors duration-200 w-full"
                        id="notes">Notes</button>
                    <button
                        class="bg-white text-purple-700 py-3 px-6 rounded-lg shadow-md hover:bg-gray-100 transition-colors duration-200 w-full">Pay
                        Bills</button>
                    <button
                        class="bg-white text-purple-700 py-3 px-6 rounded-lg shadow-md hover:bg-gray-100 transition-colors duration-200 w-full">Contact
                        List</button>
                    <button
                        class="bg-white text-purple-700 py-3 px-6 rounded-lg shadow-md hover:bg-gray-100 transition-colors duration-200 w-full">Contact
                        List</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', function () {
            const profilLink = document.getElementById('profile');
            const logoutButton = document.getElementById('logout');
            const paymentLink = document.getElementById('payment');
            const transferLink = document.getElementById('transfer');
            const historyLink = document.getElementById('history');

            const params = new URLSearchParams(window.location.search);
            const welcomeMessage = document.getElementById('welcomeMessage');
            const firstName = params.get('firstName');
            const lastName = params.get('lastName');
            const username = params.get('username');

            welcomeMessage.textContent = `Welcome, ${firstName} ${lastName}!`;

            const notes = document.getElementById('notes');

            if (logoutButton) {
                logoutButton.addEventListener('click', function (event) {
                    event.preventDefault();
                    // Redirect to login page or perform logout action
                    window.location.href = "../login.html"; // Adjust the URL as needed
                });
            }
            if (profilLink) {
                profilLink.addEventListener('click', function (event) {
                    event.preventDefault();
                    // Redirect to profile page
                    const profileUrl = `profile.html?firstName=${encodeURIComponent(firstName)}&lastName=${encodeURIComponent(lastName)}&username=${encodeURIComponent(username)}`;
                   // window.location.href = 'profile.html'; // Adjust the URL as needed
                   window.location.href = profileUrl;
                });
            }
            if (paymentLink) {
                paymentLink.addEventListener('click', function (event) {
                    event.preventDefault();
                    // Redirect to payment page
                    const transferUrl = `transfer.html?firstName=${encodeURIComponent(firstName)}&lastName=${encodeURIComponent(lastName)}&username=${encodeURIComponent(username)}`;
                    //window.location.href = 'payment.html'; // Adjust the URL as needed
                });
            }
            if (transferLink) {
                transferLink.addEventListener('click', function (event) {
                    event.preventDefault();
                    // Redirect to transfer page
                    const transferUrl = `transfer.html?firstName=${encodeURIComponent(firstName)}&lastName=${encodeURIComponent(lastName)}&username=${encodeURIComponent(username)}`;
                    //window.location.href = 'transfer.html'; // Adjust the URL as needed
                    window.location.href = transferUrl;
                });
            }
            if (historyLink) {
                historyLink.addEventListener('click', function (event) {
                    event.preventDefault();
                    // Redirect to history page
                    window.location.href = 'history.html'; // Adjust the URL as needed
                });
            }

            if (notes) {
                notes.addEventListener('click', function (event) {
                    event.preventDefault();
                    window.location.href = 'notes.html';
                });
            }
        });
    </script>
</body>

</html>
