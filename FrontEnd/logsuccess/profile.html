

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Digital Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-header {
            background: linear-gradient(to right, #6b7280, #1f2937);
        }
        .gradient-profile-bar {
            background: linear-gradient(to right, #4ade80, #10b981); /* Adjust colors as needed */
        }
        .gradient-main-bg {
            background: linear-gradient(to bottom right, #a7f3d0, #14b8a6);
        }
        .gradient-edit-info-bg {
            background: linear-gradient(to bottom, #4ade80, #10b981);
        }
        .gradient-input {
            background: linear-gradient(to right, #d1fae5, #a7f3d0);
        }
        .gradient-update-btn {
            background: linear-gradient(to right, #4ade80, #10b981);
        }
        .gradient-bg-left {
            background: linear-gradient(to right, #e2b2ff, #a280ff); /* Adjusted for visual similarity */
        }
        .gradient-bg-right {
            background: linear-gradient(to right, #a280ff, #e2b2ff); /* Adjusted for visual similarity */
        }
        .top-gradient {
            background: linear-gradient(to right, #a0a0a0, #707070, #404040); /* Darker gray to match image */
        }
    </style>
</head>
<body class="bg-gradient-to-r from-gray-700 via-gray-600 to-green-500 ">
    <div class="max-w-7xl mx-auto mt-8 bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="top-gradient text-white p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">ABC Digital Wallet</h1>
            <div class="flex space-x-4">
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="profile">Profile</a>
                <a href="#" class="px-4 py-2 bg-blue-600 rounded" id="dashboard">Dashboard</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="account">Accounts</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="transfer">Transfer</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="payment">Payments</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="history">History</a>
                <a href="#" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700 transition-colors duration-200" id="logout">Log Out</a>
            </div>
        </div>

   

    <div class="gradient-profile-bar py-2 text-white text-center text-lg">
        Profile
    </div>

    <main class="flex-grow p-4 md:p-8 flex justify-center items-start">
        <div class="gradient-main-bg rounded-lg shadow-lg overflow-hidden flex flex-col lg:flex-row w-full max-w-6xl">

            <div class="w-full lg:w-1/2 p-6 md:p-8 flex flex-col justify-between">
                <div class="mb-8">
                    <button class="bg-teal-500 text-white px-6 py-2 rounded-md shadow-md hover:bg-teal-600 transition duration-300" id="changePassword">
                        Change Password
                    </button>
                </div>

                <div>
                    <h2 class="text-xl font-semibold mb-6 text-gray-800">Your Personal Information</h2>
                    <div class="grid grid-cols-1 gap-y-4 text-gray-700">
                        <div class="flex">
                            <span class="w-1/3 font-medium">Your Name</span>
                            <span class="w-2/3">: </span>
                        </div>
                        <div class="flex">
                            <span class="w-1/3 font-medium">User Name</span>
                            <span class="w-2/3">: </span>
                        </div>
                        <div class="flex">
                            <span class="w-1/3 font-medium">E-mail</span>
                            <span class="w-2/3">: </span>
                        </div>
                        <div class="flex">
                            <span class="w-1/3 font-medium">Phone</span>
                            <span class="w-2/3">: </span>
                        </div>
                        <div class="flex">
                            <span class="w-1/3 font-medium">Age</span>
                            <span class="w-2/3">: </span>
                        </div>
                        <div class="flex">
                            <span class="w-1/3 font-medium">Account Number</span>
                            <span class="w-2/3">: </span>
                        </div>
                        <div class="flex">
                            <span class="w-1/3 font-medium">Gender</span>
                            <span class="w-2/3">: </span>
                        </div>
                        <div class="flex">
                            <span class="w-1/3 font-medium">Address</span>
                            <span class="w-2/3">: </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-1/2 p-6 md:p-8 gradient-edit-info-bg text-white flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold mb-6">Edit Info</h2>
                    <form class="space-y-4">
                        <div>
                            <label for="name" class="block text-sm font-medium mb-1">Your Name</label>
                            <input type="text" id="name" class="w-full p-2 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
                            <input type="email" id="email" class="w-full p-2 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium mb-1">Phone</label>
                            <input type="tel" id="phone" class="w-full p-2 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium mb-1">Gender</label>
                            <input type="text" id="gender" class="w-full p-2 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label for="address" class="block text-sm font-medium mb-1">Address</label>
                            <input type="text" id="address" class="w-full p-2 rounded-md gradient-input text-gray-900 focus:outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                    </form>
                </div>
                <div class="mt-8 self-end">
                    <button class="gradient-update-btn text-white px-8 py-3 rounded-md shadow-lg hover:opacity-90 transition duration-300">
                        Update
                    </button>
                </div>
            </div>

        </div>
    </main>
    <script>
        const dashboard = document.getElementById('dashboard');
        const changePassword = document.getElementById('changePassword');
        const paymentLink = document.getElementById('payment');
        const logoutButton = document.getElementById('logout');
        const transferLink = document.getElementById('transfer');
        const historyLink = document.getElementById('history');

        if(logoutButton){
            logoutButton.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to login page or perform logout action
                window.location.href = '../login.html'; // Adjust the URL as needed
            });
        }

        if(dashboard){
            dashboard.addEventListener('click',function(event) {
                event.preventDefault();
                // Redirect to dashboard page
                window.location.href = 'userHome.html'; // Adjust the URL as needed
            });
        }
        if(changePassword){
            changePassword.addEventListener('click',function(event){
                event.preventDefault();
                window.location.href = 'changepassword.html';
            });
        }
        if(paymentLink){
            paymentLink.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to payment page
                window.location.href = 'payment.html'; // Adjust the URL as needed
            });
        }
        if(transferLink){
            transferLink.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to transfer page
                window.location.href = 'transfer.html'; // Adjust the URL as needed
            });
        }
        if(historyLink){
            historyLink.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to history page
                window.location.href = 'history.html'; // Adjust the URL as needed
            });
        }
    </script>
</body>
</html>
