
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Digital Wallet : transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg-left {

            background: linear-gradient(to right, #a280ff, #e2b2ff); /* Adjusted for visual similarity */
        }

        }
        .gradient-blue-btn {
            background: linear-gradient(to right, #60a5fa, #3b82f6); /* Blue button gradient */
        }

        }

            background: linear-gradient(to right, #d1fae5, #a7f3d0); /* Light green/teal input gradient */

<body class="bg-gradient-to-r from-gray-700 via-gray-600 to-green-500 ">
    <div class="max-w-7xl mx-auto mt-8 bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="top-gradient text-white p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">ABC Digital Wallet</h1>
            <div class="flex space-x-4">
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="profile">Profile</a>
                <a href="#" class="px-4 py-2 bg-blue-600 rounded" id="dashboard">Dashboard</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="account">Accounts</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="transfer">Transfer</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="payment">Payments</a>
                <a href="#" class="px-4 py-2 hover:bg-gray-700 rounded transition-colors duration-200" id="history">History</a>
                <a href="#" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700 transition-colors duration-200" id="logout">Log Out</a>
            </div>
        </div>
        
    <main class="flex-grow gradient-main-bg p-4 md:p-8 relative">
        <h1 class="text-4xl text-center">Transfer Money</h1>
        <div class="max-w-md mx-auto py-12 flex flex-col items-start space-y-8">
            <div class="w-full flex items-center space-x-4">
                <label for="receiver-account" class="gradient-label-receiver text-white px-6 py-2 rounded-md shadow-md text-lg font-medium whitespace-nowrap">
                    Receiver Userename
                </label>
                <input type="text" id="receiver-username" class="flex-grow p-3 rounded-md gradient-input-field text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md">
            </div>

            <div class="w-full flex items-center space-x-4">
                <label for="amount"  class="gradient-label-amount text-white px-6 py-2 rounded-md shadow-md text-lg font-medium whitespace-nowrap">
                    Amount
                </label>
                <input type="number" id="amount" class="flex-grow p-3 rounded-md gradient-input-field text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-md">
            </div>

            <div class="w-full flex justify-center pt-8">
                <button type="submit" class="gradient-send-btn text-white px-12 py-3 rounded-md shadow-lg text-lg font-semibold hover:opacity-90 transition duration-300" id="sendButton">
                    Send
                </button>
            </div>
        </div>

        <div class="absolute bottom-4 left-4">
            <button class="gradient-add-beneficiary-btn text-white px-8 py-3 rounded-md shadow-lg text-lg font-semibold hover:opacity-90 transition duration-300">
                Add Beneficiary
            </button>
        </div>
    </main>

   

    </div>

    <script>
        const profilLink = document.getElementById('profile');
        const logoutButton = document.getElementById('logout');
        const paymentLink = document.getElementById('payment');
        const dashboard = document.getElementById('dashboard');
        const historyLink = document.getElementById('history');
        const sendButton = document.getElementById('sendButton');

        const urlParams = new URLSearchParams(window.location.search);
        const firstName = urlParams.get('firstName');
        const lastName = urlParams.get('lastName');
        const username = urlParams.get('username');


        if(logoutButton){
            logoutButton.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to login page or perform logout action
                window.location.href = '../login.html'; // Adjust the URL as needed
            });
        }
        if(profilLink){
            profilLink.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to profile page
                window.location.href = 'profile.html'; // Adjust the URL as needed
            });
        }
        if(paymentLink){
            paymentLink.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to payment page
                window.location.href = 'payment.html'; // Adjust the URL as needed
            });
        }
        if(dashboard){
            dashboard.addEventListener('click',function(event) {
                event.preventDefault();
                // Redirect to dashboard page
                const dashboardUrl = `./userHome.html?firstName=${encodeURIComponent(firstName)}&lastName=${encodeURIComponent(lastName)}&username=${encodeURIComponent(username)}`;
                //window.location.href = 'userHome.html'; // Adjust the URL as needed
                window.location.href = dashboardUrl;
            });
        }
        if(historyLink){
            historyLink.addEventListener('click', function(event) {
                event.preventDefault();
                // Redirect to history page
                window.location.href = 'history.html'; // Adjust the URL as needed
            });
        }

        if(sendButton){
            sendButton.addEventListener('click', function(event) {
                event.preventDefault();
                const receiverUsername = document.getElementById('receiver-username').value;
                const amount = document.getElementById('amount').value;

                if (receiverUsername && amount) {
                   
                    const transferData = {
                        receiverUsername: receiverUsername,
                        amount: amount,
                        senderUsername: username 
                    };

                   
                    fetch('transfer.php', {
                        method: 'POST', 
                        headers: {
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify(transferData) 
                    })
                    .then(response => {
                       
                        if (!response.ok) {
                            
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json(); 
                    })
                    .then(data => {
                       
                        console.log('Server response:', data);
                        if (data.success) {
                            alert(`Transfer of ${amount} to ${receiverUsername} successful! Message: ${data.message}`);
                          
                            receiverAccountInput.value = '';
                            amountInput.value = '';
                        } else {
                            alert(`Transfer failed: ${data.message || 'Unknown error.'}`);
                        }
                    })
                    .catch(error => {
                        console.error('There was a problem with the fetch operation:', error);
                        alert('An error occurred during transfer. Please try again.');
                    });

                } else {
                    alert('Please fill in both fields.');
                }
            });
        }
    </script>
</body>
</html>
