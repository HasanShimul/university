<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Digital Wallet - Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
<body class="min-h-screen bg-gradient-to-r from-teal-400 via-teal-500 to-teal-700 flex flex-col items-center">

    <header class="w-full bg-gray-800 p-4 text-white text-center shadow-lg">
        <h1 class="text-xl font-bold">ABC Digital Wallet</h1>
    </header>

    <div class="w-full py-2 px-4 bg-gradient-to-r from-green-300 via-green-400 to-green-500 text-center text-white text-lg font-semibold shadow-md">
        Registration
    </div>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-lg bg-black bg-opacity-20 backdrop-filter backdrop-blur-sm p-8 rounded-lg shadow-xl border border-white border-opacity-30 text-white">
            <form class="grid grid-cols-1 md:grid-cols-2 gap-4" action="../Backend/registration.php" method="POST">
                <div>
                    <label for="firstName" class="block text-md mb-1">First Name</label>
                    <input type="text" id="firstName" name="firstName"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
    
                <div>
                    <label for="lastName" class="block text-md mb-1">Last Name</label>
                    <input type="text" id="lastName" name="lastName"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
    
                <div>
                    <label for="userName" class="block text-md mb-1">User Name</label>
                    <input type="text" id="userName" name="userName"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
                
                <div>
                    <label for="Email" class="block text-md mb-1">E-mail </label>
                    <input type="text" id="email" name="email"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>

    
                <div>
                    <label for="password" class="block text-md mb-1">Password</label>
                    <input type="password" id="password" name="password"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
    
                <div>
                    <label for="confirmPassword" class="block text-md mb-1">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
    
    
                <div>
                    <label for="gender" class="block text-md mb-1">Gender</label>
                    <select id="gender" name="gender"
                            class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Select Gender</option> 
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
    

                <div>
                    <label for="age" class="block text-md mb-1">Age</label>
                    <input type="number" id="age" name="age"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
    
                <div>
                    <label for="phone" class="block text-md mb-1">Phone</label>
                    <input type="tel" id="phone" name="phone"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
    
                <div class="md:col-span-2">
                    <label for="address" class="block text-md mb-1">Address</label>
                    <input type="text" id="address" name="address"
                           class="w-full p-2 rounded-md bg-gradient-to-r from-gray-200 via-gray-300 to-gray-400 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-500"
                           placeholder="">
                </div>
    
                <div class="pt-4 text-center md:col-span-2">
                    <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md shadow-lg transition duration-300 ease-in-out" id="registration">
                        Register
                    </button>
                </div>
            </form>
        </div>
    </main>

    </body>
    
</html>
