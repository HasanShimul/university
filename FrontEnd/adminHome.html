<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles not covered by Tailwind, or overrides */
        body {
            font-family: Inter, sans-serif; /* Using Inter font */
        }
        /* Tables need some custom styling for rows as Tailwind doesn't have direct nth-child classes for specific colors */
        .custom-table tr:nth-child(odd){
            background-color: #3844e2; /* A shade of blue */
        }
        .custom-table tr:nth-child(even){
            background-color: #1a0880; /* A darker shade of blue/purple */
        }
        .custom-table th {
            color: rgb(0, 0, 0); /* Black text for table headers */
            text-align: left; /* Align header text to left */
            padding: 0.5rem 1rem; /* Padding for headers */
        }
        .custom-table td {
            color: white; /* White text for table data */
            text-align: left; /* Align data text to left */
            padding: 0.5rem 1rem; /* Padding for data cells */
        }
    </style>
</head>
<body class="bg-gray-800 min-h-screen flex   p-4">
    <div class="bg-gray-600 p-8 rounded-xl shadow-2xl  w-full text-center">
        <h1 class="text-3xl font-extrabold text-white mb-4">User Information Display</h1>
        <p class="text-white mb-6">Click the buttons below to retrieve user or transaction data.</p>

        <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mb-8 justify-center">
            <button id="showAllUser"
                    class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-lg
                           hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500
                           transition duration-300 ease-in-out transform hover:scale-105
                           active:scale-100 active:bg-indigo-800">
                Show All User
            </button>
            <button id="showAllTransaction"
                    class="px-8 py-3 bg-purple-600 text-white font-bold rounded-lg shadow-lg
                           hover:bg-purple-700 focus:outline-none focus:ring-4 focus:ring-purple-500
                           transition duration-300 ease-in-out transform hover:scale-105
                           active:scale-100 active:bg-purple-800">
                Show All Transaction
            </button>
            <button id="logout"
                    class="px-8 py-3 bg-red-600 text-black-600 font-bold rounded-lg shadow-lg
                           hover:bg-purple-700 focus:outline-none focus:ring-4 focus:ring-purple-500
                           transition duration-300 ease-in-out transform hover:scale-105
                           active:scale-100 active:bg-purple-800">
                Log Out
            </button>
        </div>

        <div id="infoDisplay" class="mt-8 pt-8 border-t border-gray-200 overflow-x-auto">
            <!-- Content will be loaded here -->
            <p class="text-gray-500">Select an option above to display data.</p>
        </div>
    </div>

    <script>
        // Function to fetch data from the backend

        const logoutBUtton = document.getElementById('logout');
        logoutBUtton.addEventListener('click', function() {
            // Redirect to the login page or perform logout logic
            window.location.href = '../../login.html'; // Adjust the path as necessary
        });
        async function fetchDataFromBackend(endpoint) {
            try {
                const response = await fetch(endpoint);
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! Status: ${response.status} - ${errorText}`);
                }
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.message || 'Operation failed on the server.');
                }
                return result.data; // Return the 'data' array from the JSON response
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }

        // Function to dynamically generate the user table HTML
        function generateUserTableHtml(users) {
            if (!users || users.length === 0) {
                return '<p class="text-gray-500">No user data found.</p>';
            }

            // Define the headers and corresponding data keys (matching the PHP output's lowercase keys)
            const headers = [
                { text: 'User Name', key: 'username' },
                { text: 'First Name', key: 'firstname' },
                { text: 'Last Name', key: 'lastname' },
                { text: 'Email', key: 'email' },
                { text: 'Gender', key: 'gender' },
                { text: 'Age', key: 'age' },
                { text: 'Phone', key: 'phone' },
                { text: 'Address', key: 'address' },
                { text: 'Registration Date', key: 'registrationdate' },
                { text: 'Role', key: 'role' }
            ];

            let tableHtml = `
                <table class="min-w-full border border-gray-300 rounded-lg overflow-hidden custom-table">
                    <thead class="bg-gray-200">
                        <tr>
            `;
            headers.forEach(header => {
                tableHtml += `<th class="py-2 px-4 border-b border-gray-300">${header.text}</th>`;
            });
            tableHtml += `
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                tableHtml += `<tr>`;
                headers.forEach(header => {
                    const value = user[header.key] !== null ? user[header.key] : ''; // Handle null values
                    tableHtml += `<td class="py-2 px-4 border-b border-gray-300">${value}</td>`;
                });
                tableHtml += `</tr>`;
            });

            tableHtml += `
                    </tbody>
                </table>
            `;
            return tableHtml;
        }

        // Function to dynamically generate the transaction table HTML (now truly dynamic-ready)
        function generateTransactionTableHtml(transactions) {
            if (!transactions || transactions.length === 0) {
                return '<p class="text-gray-500">No transaction data found.</p>';
            }

            // This function would be similar to generateUserTableHtml if you implement transaction backend
            // Example structure:
            // const headers = [
            //     { text: 'Trans ID', key: 'transaction_id' },
            //     { text: 'User ID', key: 'user_id' },
            //     { text: 'Amount', key: 'amount' },
            //     { text: 'Date', key: 'transaction_date' }
            // ];
            //
            // let tableHtml = `... dynamically build table from 'transactions' array ...`;
            //
            // return tableHtml;

            return '<p class="text-gray-500">Transaction data fetching is not yet implemented. This is where your dynamic table would go.</p>';
        }


        document.addEventListener('DOMContentLoaded', () => {
            const infoDisplay = document.getElementById('infoDisplay');

            document.getElementById('showAllUser').addEventListener('click', async function() {
                infoDisplay.innerHTML = '<p class="text-gray-500 animate-pulse">Loading user data...</p>';
                try {
                    // Call the backend script that provides all user details
                    const users = await fetchDataFromBackend('./Backend/userDetails.php');
                    infoDisplay.innerHTML = generateUserTableHtml(users);
                }
                catch (error) {
                    infoDisplay.innerHTML = '<p class="text-red-500">Failed to load user data: ' + error.message + '</p>';
                }
            });

            document.getElementById('showAllTransaction').addEventListener('click', async function() {
                infoDisplay.innerHTML = '<p class="text-gray-500 animate-pulse">Loading transaction data...</p>';
                try {
                    // This section remains a placeholder for when you implement transaction fetching.
                    // You would call a transaction backend script here, e.g.:
                    // const transactions = await fetchDataFromBackend('./Backend/get_all_transactions.php');
                    // infoDisplay.innerHTML = generateTransactionTableHtml(transactions);

                    // Currently, it just displays 'No transaction data found.'
                    infoDisplay.innerHTML = generateTransactionTableHtml([]);
                } catch (error) {
                    infoDisplay.innerHTML = '<p class="text-red-500">Failed to load transaction data: ' + error.message + '</p>';
                }
            });
        });
    </script>
</body>
</html>
